apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: voting-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: my-election-backend:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 5000