apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: voting-app

  labels:
    app: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: my-election-frontend:v1

          imagePullPolicy: Never

          ports:
            - containerPort: 80

          envFrom:
            - configMapRef:
                name: frontend-config

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"

            limits:
              memory: "128Mi"
              cpu: "200m"